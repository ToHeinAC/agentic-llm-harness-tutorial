[project]
name = "agentic-llm-harness-tutorial"
version = "0.1.0"
description = "A from-scratch agentic LLM harness in pure Python: chat, tool calling, agentic loop, MCP, memory, model routing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "openai>=1.50",
    "pydantic>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
